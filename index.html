<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic HMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  .hidden { display: none !important; }
  .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
  .card { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .btn { padding:.5rem 1rem; border-radius:6px; font-weight:500; cursor:pointer; border:none; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-secondary { background:#e5e7eb; color:#111; }
  .btn-secondary:hover { background:#d1d5db; }
  .btn-danger { background:#dc2626; color:#fff; }
  .input { width:100%; padding:.5rem; border:1px solid #d1d5db; border-radius:6px; }
  .label { display:block; font-size:.85rem; font-weight:500; margin-bottom:.25rem; color:#374151; }
  .badge { display:inline-block; padding:.15rem .5rem; border-radius:9999px; font-size:.75rem; font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:.5rem; text-align:left; border-bottom:1px solid #e5e7eb; font-size:.875rem; }
  th { background:#f9fafb; font-weight:600; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-start; justify-content:center; padding:2rem; overflow-y:auto; z-index:50; }
  .modal { background:#fff; border-radius:8px; max-width:900px; width:100%; padding:1.5rem; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body class="bg-gray-100">

<div id="loginScreen" class="min-h-screen flex items-center justify-center">
  <div class="card p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-2">🏥 Clinic HMS</h1>
    <p class="text-center text-gray-500 text-sm mb-6">Sign in to continue</p>
    <div id="loginError" class="hidden bg-red-100 text-red-700 p-2 rounded mb-3 text-sm"></div>
    <label class="label">Email</label>
    <input id="loginEmail" type="email" class="input mb-3" placeholder="you@clinic.com">
    <label class="label">Password</label>
    <input id="loginPassword" type="password" class="input mb-4" placeholder="••••••••">
    <button onclick="doLogin()" class="btn btn-primary w-full">Sign In</button>
    <p class="text-xs text-gray-400 text-center mt-4">First time? Ask admin to create your account.</p>
  </div>
</div>

<div id="appScreen" class="hidden">
  <div class="bg-white border-b px-4 py-2 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-xl font-bold">🏥 Clinic HMS</span>
      <span id="currentUser" class="text-sm text-gray-500"></span>
    </div>
    <div class="flex items-center gap-2">
      <span id="currentRole" class="badge bg-blue-100 text-blue-700"></span>
      <button onclick="doLogout()" class="btn btn-secondary text-sm">Logout</button>
    </div>
  </div>
  <div class="bg-white border-b px-4 flex gap-1 overflow-x-auto" id="navTabs"></div>
  <div class="p-4 max-w-7xl mx-auto" id="mainContent"></div>
</div>

<div id="modalRoot"></div>

<script>
// ============================================================
// FIREBASE CONFIG — PASTE YOURS HERE
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBdqgqtMMSSIrrkJkJ8PFAB5D6uRHcoh3I",
  authDomain: "clinic-hms-5f0fc.firebaseapp.com",
  projectId: "clinic-hms-5f0fc",
  storageBucket: "clinic-hms-5f0fc.firebasestorage.app",
  messagingSenderId: "267448604097",
  appId: "1:267448604097:web:1ddc177783bd96d245cb40"
};
// ============================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- GLOBAL STATE ----------
let CURRENT_USER = null;
let CURRENT_VIEW = 'dashboard';
let CACHE = { patients: [], drugs: [], labTests: [], radiologyTests: [] };

// ---------- AUTH ----------
function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  err.classList.add('hidden');
  auth.signInWithEmailAndPassword(email, pass).catch(e => {
    err.textContent = e.message;
    err.classList.remove('hidden');
  });
}

function doLogout() { auth.signOut(); }

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    CURRENT_USER = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
    return;
  }
  let profile = null;
  try {
    const doc = await db.collection('users').doc(user.uid).get();
    if (doc.exists) profile = doc.data();
  } catch (e) { console.error(e); }

  if (!profile) {
    profile = { email: user.email, name: user.email, role: 'pending' };
    await db.collection('users').doc(user.uid).set(profile);
  }

  CURRENT_USER = { uid: user.uid, email: user.email, ...profile };
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('currentUser').textContent = CURRENT_USER.name || CURRENT_USER.email;
  document.getElementById('currentRole').textContent = CURRENT_USER.role;

  if (CURRENT_USER.role === 'pending') {
    document.getElementById('mainContent').innerHTML =
      '<div class="card p-6 text-center"><h2 class="text-xl font-bold mb-2">Account Pending</h2>' +
      '<p class="text-gray-600">Your account is created but no role has been assigned yet. ' +
      'Ask the admin to assign you a role in Firebase Console → Firestore → users → your UID.</p></div>';
    return;
  }

  buildNav();
  await loadCache();
  renderView('dashboard');
});

// ---------- NAVIGATION ----------
const NAV_ITEMS = [
  { key: 'dashboard',     label: 'Dashboard',     roles: ['admin','doctor','nurse','lab','radiology','pharmacy','reception','cashier'] },
  { key: 'patients',      label: 'Patients',      roles: ['admin','doctor','nurse','lab','radiology','pharmacy','reception','cashier'] },
  { key: 'nurse',         label: 'Nurse / Triage',roles: ['admin','nurse','doctor'] },
  { key: 'consultation',  label: 'Consultation',  roles: ['admin','doctor'] },
  { key: 'lab',           label: 'Laboratory',    roles: ['admin','lab','doctor','nurse'] },
  { key: 'radiology',     label: 'Radiology',     roles: ['admin','radiology','doctor'] },
  { key: 'pharmacy',      label: 'Pharmacy',      roles: ['admin','pharmacy','doctor'] },
  { key: 'orthopedics',   label: 'Orthopedics',   roles: ['admin','doctor'] },
  { key: 'payments',      label: 'Payments',      roles: ['admin','cashier','reception'] },
  { key: 'admin',         label: 'Admin',         roles: ['admin'] }
];

function buildNav() {
  const nav = document.getElementById('navTabs');
  nav.innerHTML = '';
  NAV_ITEMS.filter(i => i.roles.includes(CURRENT_USER.role)).forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'px-4 py-3 text-sm whitespace-nowrap';
    btn.textContent = item.label;
    btn.dataset.key = item.key;
    btn.onclick = () => renderView(item.key);
    nav.appendChild(btn);
  });
}

function setActiveTab(key) {
  document.querySelectorAll('#navTabs button').forEach(b => {
    b.classList.toggle('tab-active', b.dataset.key === key);
  });
}

// ---------- CACHE ----------
async function loadCache() {
  try {
    const [pSnap, dSnap, lSnap, rSnap] = await Promise.all([
      db.collection('patients').orderBy('createdAt', 'desc').limit(500).get(),
      db.collection('drugs').orderBy('name').get(),
      db.collection('labTests').orderBy('name').get(),
      db.collection('radiologyTests').orderBy('name').get()
    ]);
    CACHE.patients = pSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.drugs = dSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.labTests = lSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.radiologyTests = rSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.error('Cache load error:', e); }
}

async function refreshPatients() {
  const snap = await db.collection('patients').orderBy('createdAt', 'desc').limit(500).get();
  CACHE.patients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// ---------- UTILITIES ----------
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function toast(msg, type='info') {
  const colors = { info:'bg-blue-600', success:'bg-green-600', error:'bg-red-600' };
  const t = el(`<div class="fixed top-4 right-4 ${colors[type]} text-white px-4 py-2 rounded shadow-lg z-50">${esc(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function openModal(html, size='max-w-3xl') {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal ${size}">${html}</div>
  </div>`;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function patientName(p) { return `${p.firstName || ''} ${p.lastName || ''}`.trim() || p.number || p.id; }

// ---------- VIEW ROUTER ----------
async function renderView(key) {
  CURRENT_VIEW = key;
  setActiveTab(key);
  const c = document.getElementById('mainContent');
  c.innerHTML = '<div class="text-center py-10 text-gray-500">Loading…</div>';
  try {
    if (key === 'dashboard')    await viewDashboard(c);
    else if (key === 'patients')    await viewPatients(c);
    else if (key === 'nurse')       await viewNurse(c);
    else if (key === 'consultation')await viewConsultation(c);
    else if (key === 'lab')         await viewLab(c);
    else if (key === 'radiology')   await viewRadiology(c);
    else if (key === 'pharmacy')    await viewPharmacy(c);
    else if (key === 'orthopedics') await viewOrthopedics(c);
    else if (key === 'payments')    await viewPayments(c);
    else if (key === 'admin')       await viewAdmin(c);
  } catch (e) {
    console.error(e);
    c.innerHTML = `<div class="card p-6 text-red-600">Error: ${esc(e.message)}</div>`;
  }
}

// ---------- DASHBOARD ----------
async function viewDashboard(c) {
  const today = todayStr();
  const [visitsSnap, apptSnap, paySnap] = await Promise.all([
    db.collection('visits').where('date', '==', today).get(),
    db.collection('appointments').where('date', '==', today).get(),
    db.collection('payments').where('date', '==', today).get()
  ]);
  const totalToday = paySnap.docs.reduce((s, d) => s + (d.data().amount || 0), 0);
  const cards = [
    { label: 'Patients Today', value: visitsSnap.size, color: 'bg-blue-500' },
    { label: 'Appointments Today', value: apptSnap.size, color: 'bg-green-500' },
    { label: 'Total Patients (cached)', value: CACHE.patients.length, color: 'bg-purple-500' },
    { label: 'Revenue Today (KES)', value: totalToday.toLocaleString(), color: 'bg-orange-500' }
  ];
  c.innerHTML = `
    <h2 class="text-2xl font-bold mb-4">Dashboard</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      ${cards.map(x => `<div class="card p-4 text-white ${x.color}"><div class="text-sm opacity-90">${x.label}</div><div class="text-2xl font-bold">${x.value}</div></div>`).join('')}
    </div>
    <div class="card p-4">
      <h3 class="font-semibold mb-2">Quick Actions</h3>
      <div class="flex flex-wrap gap-2">
        <button onclick="newPatientModal()" class="btn btn-primary">+ Register Patient</button>
        <button onclick="renderView('nurse')" class="btn btn-secondary">Nurse Triage</button>
        <button onclick="renderView('consultation')" class="btn btn-secondary">Start Consultation</button>
        <button onclick="renderView('payments')" class="btn btn-secondary">Record Payment</button>
      </div>
    </div>`;
}

// ============================================================
// PATIENTS MODULE
// ============================================================
async function viewPatients(c) {
  await refreshPatients();
  c.innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold">Patients</h2>
      <div class="flex gap-2">
        <input id="patientSearch" placeholder="Search name / phone / number…" class="input" style="width:280px" oninput="filterPatients()">
        <button onclick="newPatientModal()" class="btn btn-primary">+ New Patient</button>
      </div>
    </div>
    <div class="card overflow-x-auto">
      <table>
        <thead><tr><th>No.</th><th>Name</th><th>Sex/Age</th><th>Phone</th><th>Blood</th><th>Registered</th><th>Actions</th></tr></thead>
        <tbody id="patientRows"></tbody>
      </table>
    </div>`;
  renderPatientRows(CACHE.patients);
}

function filterPatients() {
  const q = document.getElementById('patientSearch').value.toLowerCase();
  const filtered = CACHE.patients.filter(p =>
    patientName(p).toLowerCase().includes(q) ||
    (p.phone || '').includes(q) ||
    (p.number || '').toLowerCase().includes(q)
  );
  renderPatientRows(filtered);
}

function renderPatientRows(list) {
  const tb = document.getElementById('patientRows');
  if (!list.length) { tb.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-400">No patients yet. Click "+ New Patient".</td></tr>'; return; }
  tb.innerHTML = list.map(p => {
    const age = p.dob ? Math.floor((Date.now() - new Date(p.dob)) / 3.154e10) : '—';
    return `<tr>
      <td>${esc(p.number || '—')}</td>
      <td><a href="#" onclick="openPatient('${p.id}');return false" class="text-blue-600 font-medium">${esc(patientName(p))}</a></td>
      <td>${esc(p.gender || '—')} / ${age}</td>
      <td>${esc(p.phone || '—')}</td>
      <td>${esc(p.bloodGroup || '—')}</td>
      <td>${fmtDate(p.createdAt)}</td>
      <td><button onclick="openPatient('${p.id}')" class="text-blue-600 text-sm">Open</button></td>
    </tr>`;
  }).join('');
}

async function generatePatientNumber() {
  const year = new Date().getFullYear();
  const snap = await db.collection('counters').doc('patients').get();
  let n = 1;
  if (snap.exists) n = (snap.data().last || 0) + 1;
  await db.collection('counters').doc('patients').set({ last: n });
  return `P${year}-${String(n).padStart(4, '0')}`;
}

async function newPatientModal() {
  const number = await generatePatientNumber();
  openModal(`
    <h3 class="text-xl font-bold mb-4">Register New Patient</h3>
    <form id="patientForm" onsubmit="savePatient(event)">
      <input type="hidden" id="pf_number" value="${number}">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="label">First Name *</label><input id="pf_firstName" required class="input"></div>
        <div><label class="label">Last Name *</label><input id="pf_lastName" required class="input"></div>
        <div><label class="label">Date of Birth</label><input id="pf_dob" type="date" class="input"></div>
        <div><label class="label">Gender</label>
          <select id="pf_gender" class="input"><option value="">—</option><option>Male</option><option>Female</option></select>
        </div>
        <div><label class="label">Phone</label><input id="pf_phone" class="input"></div>
        <div><label class="label">Blood Group</label>
          <select id="pf_bloodGroup" class="input"><option value="">—</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
        </div>
        <div class="col-span-2"><label class="label">Address</label><input id="pf_address" class="input"></div>
        <div><label class="label">Next of Kin</label><input id="pf_kin" class="input"></div>
        <div><label class="label">Next of Kin Phone</label><input id="pf_kinPhone" class="input"></div>
        <div class="col-span-2"><label class="label">Allergies</label><textarea id="pf_allergies" class="input" rows="2"></textarea></div>
        <div class="col-span-2"><label class="label">Chronic Conditions</label><textarea id="pf_chronic" class="input" rows="2"></textarea></div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Patient</button>
      </div>
    </form>
  `);
}

async function savePatient(e) {
  e.preventDefault();
  const data = {
    number: document.getElementById('pf_number').value,
    firstName: document.getElementById('pf_firstName').value.trim(),
    lastName: document.getElementById('pf_lastName').value.trim(),
    dob: document.getElementById('pf_dob').value,
    gender: document.getElementById('pf_gender').value,
    phone: document.getElementById('pf_phone').value.trim(),
    bloodGroup: document.getElementById('pf_bloodGroup').value,
    address: document.getElementById('pf_address').value.trim(),
    kin: document.getElementById('pf_kin').value.trim(),
    kinPhone: document.getElementById('pf_kinPhone').value.trim(),
    allergies: document.getElementById('pf_allergies').value.trim(),
    chronic: document.getElementById('pf_chronic').value.trim(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const ref = await db.collection('patients').add(data);
  toast('Patient registered', 'success');
  closeModal();
  await refreshPatients();
  renderView('patients');
  setTimeout(() => openPatient(ref.id), 300);
}

// ---------- PATIENT UNIFIED RECORD ----------
async function openPatient(patientId) {
  const pRef = db.collection('patients').doc(patientId);
  const [pDoc, visitsSnap, vitalsSnap, labsSnap, radsSnap, rxSnap, paySnap] = await Promise.all([
    pRef.get(),
    db.collection('visits').where('patientId','==',patientId).get(),
    db.collection('vitals').where('patientId','==',patientId).get(),
    db.collection('labOrders').where('patientId','==',patientId).get(),
    db.collection('radiologyOrders').where('patientId','==',patientId).get(),
    db.collection('prescriptions').where('patientId','==',patientId).get(),
    db.collection('payments').where('patientId','==',patientId).get()
  ]);
  const p = { id: patientId, ...pDoc.data() };

  const combine = (snap, type) => snap.docs.map(d => ({ id: d.id, _type: type, _ts: d.data().createdAt || d.data().date, ...d.data() }));
  const timeline = [
    ...combine(visitsSnap, 'Visit'),
    ...combine(vitalsSnap, 'Vitals'),
    ...combine(labsSnap, 'Lab'),
    ...combine(radsSnap, 'Radiology'),
    ...combine(rxSnap, 'Prescription'),
    ...combine(paySnap, 'Payment')
  ].sort((a, b) => {
    const ta = a._ts?.toDate ? a._ts.toDate() : new Date(a._ts || 0);
    const tb = b._ts?.toDate ? b._ts.toDate() : new Date(b._ts || 0);
    return tb - ta;
  });

  openModal(`
    <div class="flex justify-between items-start mb-4">
      <div>
        <h3 class="text-2xl font-bold">${esc(patientName(p))}</h3>
        <p class="text-gray-500 text-sm">${esc(p.number||'')} · ${esc(p.gender||'')} · ${esc(p.dob||'')} · ${esc(p.phone||'')}</p>
      </div>
      <button onclick="closeModal()" class="btn btn-secondary">Close</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
      <div class="card p-3 text-sm">
        <div><b>Blood:</b> ${esc(p.bloodGroup||'—')}</div>
        <div><b>Address:</b> ${esc(p.address||'—')}</div>
        <div><b>Next of kin:</b> ${esc(p.kin||'—')} ${esc(p.kinPhone||'')}</div>
      </div>
      <div class="card p-3 text-sm">
        <div><b>Allergies:</b> ${esc(p.allergies||'None recorded')}</div>
        <div><b>Chronic:</b> ${esc(p.chronic||'None recorded')}</div>
      </div>
    </div>

    <div class="flex flex-wrap gap-2 mb-4">
      <button onclick="closeModal();goNurse('${patientId}')" class="btn btn-primary text-sm">+ Vitals</button>
      <button onclick="closeModal();goConsult('${patientId}')" class="btn btn-primary text-sm">+ Consultation</button>
      <button onclick="closeModal();goLab('${patientId}')" class="btn btn-primary text-sm">+ Lab Order</button>
      <button onclick="closeModal();goRadiology('${patientId}')" class="btn btn-primary text-sm">+ Radiology</button>
      <button onclick="closeModal();goPharmacy('${patientId}')" class="btn btn-primary text-sm">+ Prescription</button>
      <button onclick="closeModal();goPayment('${patientId}')" class="btn btn-primary text-sm">+ Payment</button>
      <button onclick="window.print()" class="btn btn-secondary text-sm">🖨 Print Record</button>
    </div>

    <h4 class="font-semibold mb-2">Clinical Timeline</h4>
    <div class="border rounded max-h-96 overflow-y-auto">
      ${timeline.length ? timeline.map(t => `
        <div class="p-3 border-b text-sm hover:bg-gray-50" onclick="openEvent('${t._type}','${t.id}')" style="cursor:pointer">
          <span class="badge bg-blue-100 text-blue-700">${t._type}</span>
          <span class="text-gray-500 ml-2">${fmtDate(t._ts)}</span>
          <span class="ml-2 text-gray-700">${esc(t.summary || t.complaint || t.study || t.reason || (t.items ? t.items.map(i=>i.name).join(', ') : '') || t.mode || '')}</span>
        </div>
      `).join('') : '<div class="p-4 text-gray-400 text-center">No events yet.</div>'}
    </div>
  `, 'max-w-4xl');
}

function goNurse(pid)      { renderView('nurse');        setTimeout(()=>nurseSelectPatient(pid), 100); }
function goConsult(pid)    { renderView('consultation'); setTimeout(()=>consultSelectPatient(pid), 100); }
function goLab(pid)        { renderView('lab');          setTimeout(()=>labSelectPatient(pid), 100); }
function goRadiology(pid)  { renderView('radiology');    setTimeout(()=>radSelectPatient(pid), 100); }
function goPharmacy(pid)   { renderView('pharmacy');     setTimeout(()=>pharmSelectPatient(pid), 100); }
function goPayment(pid)    { renderView('payments');     setTimeout(()=>paySelectPatient(pid), 100); }

async function openEvent(type, id) {
  const collMap = { Visit:'visits', Vitals:'vitals', Lab:'labOrders', Radiology:'radiologyOrders', Prescription:'prescriptions', Payment:'payments' };
  const snap = await db.collection(collMap[type]).doc(id).get();
  if (!snap.exists) return toast('Record not found', 'error');
  const d = snap.data();
  const rows = Object.entries(d).filter(([k]) => !['patientId','createdAt'].includes(k))
    .map(([k,v]) => `<tr><td class="font-medium">${esc(k)}</td><td>${esc(typeof v === 'object' && v?.toDate ? fmtDate(v) : JSON.stringify(v))}</td></tr>`).join('');
  openModal(`
    <div class="flex justify-between mb-3">
      <h3 class="text-xl font-bold">${type} — ${id.slice(0,8)}</h3>
      <button onclick="closeModal()" class="btn btn-secondary">Close</button>
    </div>
    <table><tbody>${rows}</tbody></table>
  `);
}

async function getOrCreateTodayVisit(patientId) {
  const today = todayStr();
  const snap = await db.collection('visits')
    .where('patientId','==',patientId)
    .where('date','==',today)
    .limit(1).get();
  if (!snap.empty) return { id: snap.docs[0].id, ...snap.docs[0].data() };
  const ref = await db.collection('visits').add({
    patientId, date: today, status: 'open',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    createdBy: CURRENT_USER.uid
  });
  return { id: ref.id, patientId, date: today, status: 'open' };
}

function patientPicker(inputId, onPick) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(inputId + '_list');
  input.oninput = () => {
    const q = input.value.toLowerCase();
    if (!q) { list.innerHTML = ''; return; }
    const hits = CACHE.patients.filter(p =>
      patientName(p).toLowerCase().includes(q) || (p.number||'').toLowerCase().includes(q) ||
      (p.phone||'').includes(q)
    ).slice(0, 8);
    list.innerHTML = hits.map(p =>
      `<div class="p-2 hover:bg-blue-50 cursor-pointer border-b" onclick='pickPatient("${p.id}")'>
         <b>${esc(patientName(p))}</b> <span class="text-gray-500 text-xs">${esc(p.number||'')} · ${esc(p.phone||'')}</span>
       </div>`).join('');
    window.pickPatient = (id) => {
      const p = CACHE.patients.find(x => x.id === id);
      input.value = patientName(p);
      input.dataset.patientId = id;
      list.innerHTML = '';
      onPick(p);
    };
  };
}

function selectedPatient(inputId) {
  const id = document.getElementById(inputId)?.dataset.patientId;
  return id ? CACHE.patients.find(p => p.id === id) : null;
}

async function savePrescription() {
  const inp = document.getElementById('pp_patient');
  const patientId = inp.dataset.patientId;
  if (!patientId) return toast('Select patient', 'error');
  const rows = [...document.querySelectorAll('#pp_items > div')];
  const items = rows.map(r => {
    const sel = r.querySelector('.rx-drug');
    const nameInp = r.querySelector('.rx-drug-name');
    const qty = parseInt(r.querySelector('.rx-qty').value) || 0;
    const sig = r.querySelector('.rx-sig').value.trim();
    let name = '', price = 0, drugId = null;
    if (sel) {
      const opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.value) return null;
      name = opt.dataset.name;
      price = parseFloat(opt.dataset.price) || 0;
      drugId = opt.value;
    } else {
      name = (nameInp?.value || '').trim();
      if (!name) return null;
    }
    return { drugId, name, qty, sig, price, total: price * qty };
  }).filter(Boolean);
  if (!items.length) return toast('Add at least one drug', 'error');

  const visit = await getOrCreateTodayVisit(patientId);
  await db.collection('prescriptions').add({
    patientId, visitId: visit.id, date: todayStr(),
    items, notes: document.getElementById('pp_notes').value.trim(),
    status: 'pending',
    prescriberId: CURRENT_USER.uid,
    prescriberName: CURRENT_USER.name || CURRENT_USER.email,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  toast('Prescription saved', 'success');
  closeModal(); renderView('pharmacy');
}

async function dispenseModal(rxId) {
  const doc = await db.collection('prescriptions').doc(rxId).get();
  const r = doc.data();
  const p = CACHE.patients.find(x => x.id === r.patientId);
  openModal(`

    <table class="mb-3"><thead><tr><th>Drug</th><th>Qty</th><th>Sig</th><th>In stock</th></tr></thead><tbody>
      ${(r.items||[]).map(i => {

      }).join('')}
    </tbody></table>
    <div class="flex justify-end gap-2">
      <button onclick="closeModal()" class="btn btn-secondary">Cancel</button>
      <button onclick="confirmDispense('${rxId}')" class="btn btn-primary">Confirm Dispense</button>
    </div>
  `);
}

async function confirmDispense(rxId) {
  const doc = await db.collection('prescriptions').doc(rxId).get();
  const r = doc.data();
  const batch = db.batch();
  for (const item of r.items || []) {
    if (!item.drugId) continue;
    const dref = db.collection('drugs').doc(item.drugId);
    const ds = await dref.get();
    if (!ds.exists) continue;
    const cur = ds.data().stock || 0;
    batch.update(dref, { stock: Math.max(0, cur - item.qty) });
  }
  batch.update(db.collection('prescriptions').doc(rxId), {
    status: 'dispensed',
    dispensedAt: firebase.firestore.FieldValue.serverTimestamp(),
    dispensedBy: CURRENT_USER.uid
  });
  await batch.commit();
  toast('Dispensed', 'success');
  closeModal(); renderView('pharmacy');
}

async function savePayment() {
  const inp = document.getElementById('pay_patient');
  const patientId = inp.dataset.patientId;
  if (!patientId) return toast('Select patient', 'error');
  const items = [...document.querySelectorAll('#pay_items > div')].map(r => ({
    desc: r.querySelector('.pay-item-desc').value.trim(),
    amount: parseFloat(r.querySelector('.pay-item-amt').value)||0
  })).filter(i => i.desc && i.amount);
  const amount = parseFloat(document.getElementById('pay_amount').value)||0;
  if (!amount) return toast('Enter amount', 'error');
  const mode = document.getElementById('pay_mode').value;
  const receiptNo = 'R' + Date.now().toString().slice(-8);
  const visit = await getOrCreateTodayVisit(patientId);
  const data = {
    patientId, visitId: visit.id, date: todayStr(),
    items, amount, mode, receipt: receiptNo,
    mpesaCode: document.getElementById('pay_mpesa')?.value.trim() || '',
    shaMember: document.getElementById('pay_sha_member')?.value.trim() || '',
    shaRef: document.getElementById('pay_sha_ref')?.value.trim() || '',
    notes: document.getElementById('pay_notes').value.trim(),
    receivedBy: CURRENT_USER.uid,
    receivedByName: CURRENT_USER.name || CURRENT_USER.email,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const ref = await db.collection('payments').add(data);
  toast('Payment recorded', 'success');
  closeModal(); renderView('payments');
  setTimeout(() => printReceipt(ref.id), 300);
}

async function printReceipt(paymentId) {
  const doc = await db.collection('payments').doc(paymentId).get();
  const p = doc.data();
  const pt = CACHE.patients.find(x => x.id === p.patientId);
  const html = `
    <div id="printArea" style="font-family:monospace;max-width:340px;margin:auto">
      <div class="text-center"><h3 style="margin:0">Clinic HMS</h3>
      <div style="font-size:12px">Official Receipt</div></div>
      <hr>
      <div style="font-size:12px">
        Receipt: <b>${esc(p.receipt)}</b><br>
        Date: ${fmtDate(p.createdAt)}<br>
        Patient: ${esc(pt ? patientName(pt) : '—')}<br>
        Number: ${esc(pt?.number||'')}<br>
        Mode: <b>${esc(p.mode)}</b>
        ${p.mpesaCode ? `<br>Mpesa: ${esc(p.mpesaCode)}` : ''}
        ${p.shaMember ? `<br>SHA Member: ${esc(p.shaMember)}<br>SHA Ref: ${esc(p.shaRef||'')}` : ''}
      </div>
      <hr>
      <table style="width:100%;font-size:12px">
        <thead><tr><th align="left">Item</th><th align="right">Amount</th></tr></thead>
        <tbody>
          ${(p.items||[]).map(i => `<tr><td>${esc(i.desc)}</td><td align="right">${i.amount.toLocaleString()}</td></tr>`).join('')}
        </tbody>
      </table>
      <hr>
      <div style="text-align:right;font-size:14px"><b>Total: KES ${(p.amount||0).toLocaleString()}</b></div>
      <hr>
      <div style="font-size:11px;text-align:center">Served by ${esc(p.receivedByName||'')}<br>Thank you!</div>
    </div>
    <div class="flex justify-end gap-2 mt-4 no-print">
      <button onclick="window.print()" class="btn btn-primary">🖨 Print</button>
      <button onclick="closeModal()" class="btn btn-secondary">Close</button>
    </div>`;
  openModal(html, 'max-w-md');
}

async function viewAdmin(c) {
  const [usersSnap, patSnap, visSnap, paySnap] = await Promise.all([
    db.collection('users').get(),
    db.collection('patients').get(),
    db.collection('visits').get(),
    db.collection('payments').get()
  ]);
  const users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const totalRevenue = paySnap.docs.reduce((s,d) => s + (d.data().amount||0), 0);

  c.innerHTML = `
    <h2 class="text-2xl font-bold mb-4">Admin</h2>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <div class="card p-3"><div class="text-xs text-gray-500">Total Patients</div>
        <div class="text-2xl font-bold">${patSnap.size}</div></div>
      <div class="card p-3"><div class="text-xs text-gray-500">Total Visits</div>
        <div class="text-2xl font-bold">${visSnap.size}</div></div>
      <div class="card p-3"><div class="text-xs text-gray-500">Total Revenue</div>
        <div class="text-2xl font-bold">KES ${totalRevenue.toLocaleString()}</div></div>
      <div class="card p-3"><div class="text-xs text-gray-500">Staff Accounts</div>
        <div class="text-2xl font-bold">${users.length}</div></div>
    </div>

    <div class="card p-4 mb-4">
      <h3 class="font-semibold mb-2">Staff & Roles</h3>
      <p class="text-xs text-gray-500 mb-3">To add staff: Firebase Console → Authentication → Users → Add user. Then assign a role here.</p>
      <table><thead><tr><th>Name / Email</th><th>Role</th><th>Change role</th></tr></thead><tbody>
        ${users.map(u => `<tr>
          <td>${esc(u.name||u.email||u.id)}<br><span class="text-xs text-gray-500">${esc(u.email||'')}</span></td>
          <td>${esc(u.role||'pending')}</td>
          <td>
            <select onchange="changeRole('${u.id}', this.value)" class="input" style="width:auto">
              ${['admin','doctor','nurse','lab','radiology','pharmacy','reception','cashier','pending']
                .map(r => `<option ${u.role===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('')}
      </tbody></table>
    </div>

    <div class="card p-4">
      <h3 class="font-semibold mb-2">Catalogs</h3>
      <div class="flex flex-wrap gap-2">
        <button onclick="manageDrugCatalog()" class="btn btn-secondary">💊 Drug Catalog</button>
        <button onclick="manageLabCatalog()" class="btn btn-secondary">🔬 Lab Tests</button>
        <button onclick="manageRadCatalog()" class="btn btn-secondary">🩻 Radiology Tests</button>
      </div>
    </div>`;
}

async function changeRole(uid, role) {
  await db.collection('users').doc(uid).update({ role });
  toast('Role updated', 'success');
}
</script>
