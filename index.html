      <button class="btn btn-secondary py-3 text-xl" onclick="pinAppend('6')">6</button>

</div>

<script>
// ============================================================
// FIREBASE CONFIG — PASTE YOURS HERE
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBdqgqtMMSSIrrkJkJ8PFAB5D6uRHcoh3I",
  authDomain: "clinic-hms-5f0fc.firebaseapp.com",
  projectId: "clinic-hms-5f0fc",
  storageBucket: "clinic-hms-5f0fc.firebasestorage.app",
  messagingSenderId: "267448604097",
  appId: "1:267448604097:web:1ddc177783bd96d245cb40"
};
// ============================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();


 // ---------- PIN LOGIN ----------
let PIN_INPUT = '';

function pinAppend(digit) {
  if (PIN_INPUT.length >= 4) return;
  PIN_INPUT += digit;
  const el = document.getElementById('pinDisplay');
  if (el) el.value = '●'.repeat(PIN_INPUT.length);
}

function pinDelete() {
  PIN_INPUT = PIN_INPUT.slice(0, -1);
  const el = document.getElementById('pinDisplay');
  if (el) el.value = '●'.repeat(PIN_INPUT.length);
}

function pinClear() {
  PIN_INPUT = '';
  const el = document.getElementById('pinDisplay');
  if (el) el.value = '';
}

async function pinSubmit() {
  if (PIN_INPUT.length < 4) {
    pinShowError('Enter a 4-digit PIN');
    return;
  }

  const pin = PIN_INPUT;
  pinClear();
  pinShowError('');

  try {
    const doc = await db.collection('pinCodes').doc(pin).get();
    if (!doc.exists) {
      pinShowError('Invalid PIN');
      return;
    }

    const data = doc.data();
    if (!data.email || !data.password) {
      pinShowError('PIN not configured. Contact admin.');
      return;
    }

    await auth.signInWithEmailAndPassword(data.email, data.password);
  } catch (e) {
    console.error('PIN login error:', e);
    if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password') {
      pinShowError('Invalid PIN');
    } else if (e.code === 'permission-denied') {
      pinShowError('Access denied. Contact admin.');
    } else {
      pinShowError('Login failed: ' + e.message);
    }
  }
}

function pinShowError(msg) {
  const el = document.getElementById('loginError');
  if (!el) return;
  if (!msg) {
    el.classList.add('hidden');
  } else {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
}

// Physical keyboard support on the PIN screen
document.addEventListener('keydown', (e) => {
  const loginScreen = document.getElementById('loginScreen');
  if (!loginScreen || loginScreen.classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pinAppend(e.key);
  else if (e.key === 'Backspace') pinDelete();
  else if (e.key === 'Enter') pinSubmit();
  else if (e.key === 'Escape') pinClear();
}); 
// ---------- GLOBAL STATE ----------
let CURRENT_USER = null;
let CURRENT_VIEW = 'dashboard';
let CACHE = { patients: [], drugs: [], labTests: [], radiologyTests: [] };

// ---------- AUTH ----------
function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  err.classList.add('hidden');
  auth.signInWithEmailAndPassword(email, pass).catch(e => {
    err.textContent = e.message;
    err.classList.remove('hidden');
  });
}

function doLogout() { auth.signOut(); }

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    CURRENT_USER = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
    return;
  }
  let profile = null;
  try {
    const doc = await db.collection('users').doc(user.uid).get();
    if (doc.exists) profile = doc.data();
  } catch (e) { console.error(e); }

  if (!profile) {
    profile = { email: user.email, name: user.email, role: 'pending' };
    await db.collection('users').doc(user.uid).set(profile);
  }

  CURRENT_USER = { uid: user.uid, email: user.email, ...profile };
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('currentUser').textContent = CURRENT_USER.name || CURRENT_USER.email;
  document.getElementById('currentRole').textContent = CURRENT_USER.role;

  if (CURRENT_USER.role === 'pending') {
    document.getElementById('mainContent').innerHTML =
      '<div class="card p-6 text-center"><h2 class="text-xl font-bold mb-2">Account Pending</h2>' +
      '<p class="text-gray-600">Your account is created but no role has been assigned yet. ' +
      'Ask the admin to assign you a role in Firebase Console → Firestore → users → your UID.</p></div>';
    return;
  }

  buildNav();
  await loadCache();
  renderView('dashboard');
});

// ---------- NAVIGATION ----------
const NAV_ITEMS = [
  { key: 'dashboard',     label: 'Dashboard',     roles: ['admin','doctor','nurse','lab','radiology','pharmacy','reception','cashier'] },
  { key: 'patients',      label: 'Patients',      roles: ['admin','doctor','nurse','lab','radiology','pharmacy','reception','cashier'] },
  { key: 'appointments', label: 'Appointments', roles: ['admin','doctor','nurse','reception','cashier'] },
  { key: 'queue', label: 'Queue', roles: ['admin','doctor','nurse','reception','cashier'] },
  { key: 'nurse',         label: 'Nurse / Triage',roles: ['admin','nurse','doctor'] },
  { key: 'consultation',  label: 'Consultation',  roles: ['admin','doctor'] },
  { key: 'referral',       label: 'Referral',        roles: ['admin','doctor'] },
  { key: 'lab',           label: 'Laboratory',    roles: ['admin','lab','doctor','nurse'] },
  { key: 'radiology',     label: 'Radiology',     roles: ['admin','radiology','doctor'] },
  { key: 'pharmacy',      label: 'Pharmacy',      roles: ['admin','pharmacy','doctor'] },
  { key: 'orthopedics',   label: 'Orthopedics',   roles: ['admin','doctor'] },
  { key: 'payments',      label: 'Payments',      roles: ['admin','cashier','reception'] },
  { key: 'invoices', label: 'Invoices', roles: ['admin','cashier','reception'] },
  { key: 'reports', label: 'Reports', roles: ['admin','doctor','cashier'] },
  { key: 'admin',         label: 'Admin',         roles: ['admin'] }
];

function buildNav() {
  const nav = document.getElementById('navTabs');
  nav.innerHTML = '';
  NAV_ITEMS.filter(i => i.roles.includes(CURRENT_USER.role)).forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'px-4 py-3 text-sm whitespace-nowrap';
    btn.textContent = item.label;
    btn.dataset.key = item.key;
    btn.onclick = () => renderView(item.key);
    nav.appendChild(btn);
  });
}

function setActiveTab(key) {
  document.querySelectorAll('#navTabs button').forEach(b => {
    b.classList.toggle('tab-active', b.dataset.key === key);
  });
}

// ---------- CACHE ----------
async function loadCache() {
  try {
   const [pSnap, dSnap, lSnap, rSnap, tSnap, iSnap] = await Promise.all([
  db.collection('patients').orderBy('createdAt', 'desc').limit(500).get(),
  db.collection('drugs').orderBy('name').get(),
  db.collection('labTests').orderBy('name').get(),
  db.collection('radiologyTests').orderBy('name').get(),
  db.collection('rxTemplates').orderBy('name').get(),
  db.collection('drugInteractions').get()
]); 
    CACHE.patients = pSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.drugs = dSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.labTests = lSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.radiologyTests = rSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.rxTemplates = tSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    CACHE.drugInteractions = iSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.error('Cache load error:', e); }
}
async function refreshPatients() {
  const snap = await db.collection('patients').orderBy('createdAt', 'desc').limit(500).get();
  CACHE.patients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// ---------- UTILITIES ----------
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function toast(msg, type='info') {
  const colors = { info:'bg-blue-600', success:'bg-green-600', error:'bg-red-600' };
  const t = el(`<div class="fixed top-4 right-4 ${colors[type]} text-white px-4 py-2 rounded shadow-lg z-50">${esc(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function openModal(html, size='max-w-3xl') {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal ${size}">${html}</div>
  </div>`;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function patientName(p) { return `${p.firstName || ''} ${p.lastName || ''}`.trim() || p.number || p.id; }

// ---------- VIEW ROUTER ----------
async function renderView(key) {
  CURRENT_VIEW = key;
  setActiveTab(key);
    const c = document.getElementById('mainContent');
  c.innerHTML = '<div class="text-center py-10 text-gray-500">Loading…</div>';
  c.offsetHeight;  // force a reflow so the browser registers the change
  try {
    if (key === 'dashboard')    await viewDashboard(c);
    else if (key === 'patients')    await viewPatients(c);
    else if (key === 'appointments') await viewAppointments(c);  
    else if (key === 'queue') await viewQueue(c);  
    else if (key === 'nurse')       await viewNurse(c);
    else if (key === 'consultation')await viewConsultation(c);
    else if (key === 'referral')    await viewReferral(c);  
    else if (key === 'lab')         await viewLab(c);
    else if (key === 'radiology')   await viewRadiology(c);
    else if (key === 'pharmacy')    await viewPharmacy(c);
    else if (key === 'orthopedics') await viewOrthopedics(c);
    else if (key === 'payments')    await viewPayments(c);
    else if (key === 'invoices') await viewInvoices(c);  
    else if (key === 'reports') await viewReports(c);  
    else if (key === 'admin')       await viewAdmin(c);
  } catch (e) {
    console.error(e);
    c.innerHTML = `<div class="card p-6 text-red-600">Error: ${esc(e.message)}</div>`;
  }
}

// ---------- DASHBOARD ----------
async function viewDashboard(c) {
  const today = todayStr();
  const [visitsSnap, apptSnap, paySnap] = await Promise.all([
    db.collection('visits').where('date', '==', today).get(),
    db.collection('appointments').where('date', '==', today).get(),
    db.collection('payments').where('date', '==', today).get()
  ]);
  const totalToday = paySnap.docs.reduce((s, d) => s + (d.data().amount || 0), 0);
  const cards = [
    { label: 'Patients Today', value: visitsSnap.size, color: 'bg-blue-500' },
    { label: 'Appointments Today', value: apptSnap.size, color: 'bg-green-500' },
    { label: 'Total Patients (cached)', value: CACHE.patients.length, color: 'bg-purple-500' },
    { label: 'Revenue Today (KES)', value: totalToday.toLocaleString(), color: 'bg-orange-500' }
  ];
  c.innerHTML = `
    <h2 class="text-2xl font-bold mb-4">Dashboard</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      ${cards.map(x => `<div class="card p-4 text-white ${x.color}"><div class="text-sm opacity-90">${x.label}</div><div class="text-2xl font-bold">${x.value}</div></div>`).join('')}
    </div>
    <div class="card p-4">
      <h3 class="font-semibold mb-2">Quick Actions</h3>
      <div class="flex flex-wrap gap-2">
        <button onclick="newPatientModal()" class="btn btn-primary">+ Register Patient</button>
        <button onclick="renderView('nurse')" class="btn btn-secondary">Nurse Triage</button>
        <button onclick="renderView('consultation')" class="btn btn-secondary">Start Consultation</button>
        <button onclick="renderView('payments')" class="btn btn-secondary">Record Payment</button>
      </div>
    </div>`;
}

// ============================================================
// PATIENTS MODULE
// ============================================================
async function viewPatients(c) {
  await refreshPatients();
  c.innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold">Patients</h2>
      <div class="flex gap-2">
        <input id="patientSearch" placeholder="Search name / phone / number…" class="input" style="width:280px" oninput="filterPatients()">
        <button onclick="newPatientModal()" class="btn btn-primary">+ New Patient</button>
      </div>
    </div>
    <div class="card overflow-x-auto">
      <table>
        <thead><tr><th>No.</th><th>Name</th><th>Sex/Age</th><th>Phone</th><th>Blood</th><th>Registered</th><th>Actions</th></tr></thead>
        <tbody id="patientRows"></tbody>
      </table>
    </div>`;
  renderPatientRows(CACHE.patients);
}

function filterPatients() {
  const q = document.getElementById('patientSearch').value.toLowerCase();
  const filtered = CACHE.patients.filter(p =>
    patientName(p).toLowerCase().includes(q) ||
    (p.phone || '').includes(q) ||
    (p.number || '').toLowerCase().includes(q)
  );
  renderPatientRows(filtered);
}

function renderPatientRows(list) {
  const tb = document.getElementById('patientRows');
  if (!list.length) { tb.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-400">No patients yet. Click "+ New Patient".</td></tr>'; return; }
  tb.innerHTML = list.map(p => {
    const age = p.dob ? Math.floor((Date.now() - new Date(p.dob)) / 3.154e10) : '—';
    return `<tr>
      <td>${esc(p.number || '—')}</td>
      <td><a href="#" onclick="openPatient('${p.id}');return false" class="text-blue-600 font-medium">${esc(patientName(p))}</a></td>
      <td>${esc(p.gender || '—')} / ${age}</td>
      <td>${esc(p.phone || '—')}</td>
      <td>${esc(p.bloodGroup || '—')}</td>
      <td>${fmtDate(p.createdAt)}</td>
      <td><button onclick="openPatient('${p.id}')" class="text-blue-600 text-sm">Open</button></td>
    </tr>`;
  }).join('');
}


async function generatePatientNumber() {
  const year = new Date().getFullYear();
  const ref = db.collection('counters').doc('patients');
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    const n = snap.exists ? (snap.data().last || 0) + 1 : 1;
    tx.set(ref, { last: n });
    return `P${year}-${String(n).padStart(4,'0')}`;
  });
}
async function newPatientModal() {
  const number = await generatePatientNumber();
  openModal(`
    <h3 class="text-xl font-bold mb-4">Register New Patient</h3>
    <form id="patientForm" onsubmit="savePatient(event)">
      <input type="hidden" id="pf_number" value="${number}">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="label">First Name *</label><input id="pf_firstName" required class="input"></div>
        <div><label class="label">Last Name *</label><input id="pf_lastName" required class="input"></div>
        <div><label class="label">Date of Birth</label><input id="pf_dob" type="date" class="input"></div>
        <div><label class="label">Gender</label>
          <select id="pf_gender" class="input"><option value="">—</option><option>Male</option><option>Female</option></select>
        </div>
        <div><label class="label">Phone</label><input id="pf_phone" class="input"></div>
        <div><label class="label">Blood Group</label>
          <select id="pf_bloodGroup" class="input"><option value="">—</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
        </div>
        <div class="col-span-2"><label class="label">Address</label><input id="pf_address" class="input"></div>
        <div><label class="label">Next of Kin</label><input id="pf_kin" class="input"></div>
        <div><label class="label">Next of Kin Phone</label><input id="pf_kinPhone" class="input"></div>
        <div class="col-span-2"><label class="label">Allergies</label><textarea id="pf_allergies" class="input" rows="2"></textarea></div>
        <div class="col-span-2"><label class="label">Chronic Conditions</label><textarea id="pf_chronic" class="input" rows="2"></textarea></div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Patient</button>
      </div>
    </form>
  `);
}

async function savePatient(e) {
  e.preventDefault();
  const data = {
    number: document.getElementById('pf_number').value,
    firstName: document.getElementById('pf_firstName').value.trim(),
    lastName: document.getElementById('pf_lastName').value.trim(),
    dob: document.getElementById('pf_dob').value,
    gender: document.getElementById('pf_gender').value,
    phone: document.getElementById('pf_phone').value.trim(),
    bloodGroup: document.getElementById('pf_bloodGroup').value,
    address: document.getElementById('pf_address').value.trim(),
    kin: document.getElementById('pf_kin').value.trim(),
    kinPhone: document.getElementById('pf_kinPhone').value.trim(),
    allergies: document.getElementById('pf_allergies').value.trim(),
    chronic: document.getElementById('pf_chronic').value.trim(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const ref = await db.collection('patients').add(data);
  toast('Patient registered', 'success');
  closeModal();
  await refreshPatients();
  renderView('patients');
  setTimeout(() => openPatient(ref.id), 300);
}

// ---------- PATIENT UNIFIED RECORD ----------
async function openPatient(patientId) {
  const pRef = db.collection('patients').doc(patientId);
  const [pDoc, visitsSnap, vitalsSnap, labsSnap, radsSnap, rxSnap, paySnap] = await Promise.all([
    pRef.get(),

async function openEvent(type, id) {
  const collMap = { Visit:'visits', Vitals:'vitals', Lab:'labOrders', Radiology:'radiologyOrders', Prescription:'prescriptions', Payment:'payments' };
  const snap = await db.collection(collMap[type]).doc(id).get();

  const d = snap.data();
  const rows = Object.entries(d).filter(([k]) => !['patientId','createdAt'].includes(k))
    .map(([k,v]) => `<tr><td class="font-medium">${esc(k)}</td><td>${esc(typeof v === 'object' && v?.toDate ? fmtDate(v) : JSON.stringify(v))}</td></tr>`).join('');

      <button onclick="closeModal()" class="btn btn-secondary">Close</button>
    </div>
    <table><tbody>${rows}</tbody></table>
  `);

async function getOrCreateTodayVisit(patientId) {
  const today = todayStr();
  const snap = await db.collection('visits')
    .where('patientId','==',patientId)
    .where('date','==',today)
    .limit(1).get();
  if (!snap.empty) return { id: snap.docs[0].id, ...snap.docs[0].data() };
  const ref = await db.collection('visits').add({
    patientId, date: today, status: 'open',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    createdBy: CURRENT_USER.uid
  });
  return { id: ref.id, patientId, date: today, status: 'open' };
}

function patientPicker(inputId, onPick) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(inputId + '_list');
  input.oninput = () => {
    const q = input.value.toLowerCase();
    if (!q) { list.innerHTML = ''; return; }
    const hits = CACHE.patients.filter(p =>
      patientName(p).toLowerCase().includes(q) || (p.number||'').toLowerCase().includes(q) ||
      (p.phone||'').includes(q)
    ).slice(0, 8);
    list.innerHTML = hits.map(p =>
      `<div class="p-2 hover:bg-blue-50 cursor-pointer border-b" onclick='pickPatient("${p.id}")'>
         <b>${esc(patientName(p))}</b> <span class="text-gray-500 text-xs">${esc(p.number||'')} · ${esc(p.phone||'')}</span>
       </div>`).join('');
    window.pickPatient = (id) => {
      const p = CACHE.patients.find(x => x.id === id);
      input.value = patientName(p);
      input.dataset.patientId = id;
      list.innerHTML = '';
      onPick(p);
    };
  };
}

function selectedPatient(inputId) {
  const id = document.getElementById(inputId)?.dataset.patientId;
  return id ? CACHE.patients.find(p => p.id === id) : null;
}

  document.getElementById('nv_bmi').value = bmi;
}

function printElement(selectorOrHtml) {
  let html = '';
  if (typeof selectorOrHtml === 'string' && selectorOrHtml.trim().startsWith('<')) {
    html = selectorOrHtml;
  } else if (typeof selectorOrHtml === 'string') {
    const el = document.querySelector(selectorOrHtml);
    if (!el) { toast('Nothing to print', 'error'); return; }
    html = el.innerHTML;
  } else if (selectorOrHtml instanceof HTMLElement) {
    html = selectorOrHtml.innerHTML;
  }
  if (!html) { toast('Nothing to print', 'error'); return; }

  const fullHtml = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Print</title>
      <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; color: #000; background: #fff; margin: 0; }
        h1, h2, h3 { margin: 0 0 .5rem 0; }
        table { width: 100%; border-collapse: collapse; margin: .5rem 0; }
        th, td { padding: 6px; text-align: left; border-bottom: 1px solid #ccc; font-size: 13px; }
        th { background: #f0f0f0; font-weight: 600; }
        img { max-width: 100%; }
        .badge { padding: 2px 6px; border-radius: 3px; font-size: 11px; }
        .whitespace-pre-wrap { white-space: pre-wrap; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .text-xs { font-size: 11px; }
        .text-sm { font-size: 12px; }
        .text-gray-500 { color: #666; }
        .text-red-600 { color: #dc2626; }
        .text-red-700 { color: #b91c1c; }
        .bg-blue-100 { background: #dbeafe; }
        .text-blue-700 { color: #1d4ed8; }
        .bg-yellow-100 { background: #fef3c7; }
        .text-yellow-700 { color: #a16207; }
        .bg-green-100 { background: #dcfce7; }
        .text-green-700 { color: #15803d; }
        .bg-gray-100 { background: #f3f4f6; }
        .bg-gray-200 { background: #e5e7eb; }
      </style>
    </head>
    <body>${html}</body>
    </html>
  `;

  // Remove any existing print iframe
  const oldFrame = document.getElementById('printIframe');
  if (oldFrame) oldFrame.remove();

  // Create iframe
  const iframe = document.createElement('iframe');
  iframe.id = 'printIframe';
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  iframe.style.visibility = 'hidden';
  document.body.appendChild(iframe);

  // CRITICAL: attach onload BEFORE writing, so the event is caught
  iframe.onload = () => {
    try {
      // Small delay so the browser paints the content
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        // Remove the iframe after the print dialog closes
        setTimeout(() => {
          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        }, 1500);
      }, 100);
    } catch (e) {
      console.error('Print failed:', e);
      toast('Print failed: ' + e.message, 'error');
    }
  };

  // Write the document AFTER onload is attached
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(fullHtml);
  doc.close();
}

// LAB RESULT FLAGGING
// ============================================================
function flagLabResult(test, resultValue) {
  if (!resultValue || resultValue === '') return { flag: '', color: '' };
  const val = String(resultValue).trim();

  // 1) Numeric range check (if test has "range" like "4-11" or "4 - 11")
  if (test.range) {
    const m = String(test.range).match(/^\s*(-?\d+\.?\d*)\s*(?:-|–|to)\s*(-?\d+\.?\d*)\s*$/i);
    if (m) {
      const min = parseFloat(m[1]);
      const max = parseFloat(m[2]);
      const num = parseFloat(val);
      if (!isNaN(num)) {
        if (num < min) return { flag: 'LOW', color: 'bg-red-100 text-red-700' };
        if (num > max) return { flag: 'HIGH', color: 'bg-red-100 text-red-700' };
        return { flag: 'Normal', color: 'bg-green-100 text-green-700' };
      }
    }
  }

  // 2) Text normal check (if test has normalText like "Negative")
  if (test.normalText) {
    const normalized = val.toLowerCase();
    const expected = String(test.normalText).toLowerCase().trim();
    if (normalized === expected || normalized.includes(expected)) {
      return { flag: 'Normal', color: 'bg-green-100 text-green-700' };
    }
    return { flag: 'Abnormal', color: 'bg-red-100 text-red-700' };
  }

  // 3) No rule → no flag
  return { flag: '', color: '' };
}

  ];

  // Check existing drugs

  const existing = new Set(snap.docs.map(d => {
    const x = d.data();
    return `${(x.name||'').toLowerCase().trim()}|${(x.strength||'').toLowerCase().trim()}`;
  }));

  let created = 0, skipped = 0;
  const batch = db.batch();
  let batchCount = 0;

  for (const d of catalog) {
    const key = `${d.name.toLowerCase().trim()}|${(d.strength||'').toLowerCase().trim()}`;
    if (existing.has(key)) { skipped++; continue; }

    const ref = db.collection('drugs').doc();

    });
    batchCount++;
    created++;

    if (batchCount === 400) {
      await batch.commit();
      batchCount = 0;
    }
  }

  if (batchCount > 0) await batch.commit();

  await loadCache();
  toast(`${created} drugs added, ${skipped} skipped`, 'success');
  if (typeof manageDrugCatalog === 'function') manageDrugCatalog();
}

async function saveLabOrder() {
  const inp = document.getElementById('lo_patient');
  const patientId = inp.dataset.patientId;
  if (!patientId) return toast('Select patient', 'error');
  const checked = [...document.querySelectorAll('.lab-test-cb:checked')];
  if (!checked.length) return toast('Select at least one test', 'error');
  const tests = checked.map(cb => ({ id: cb.value, name: cb.dataset.name, price: parseFloat(cb.dataset.price)||0 }));
  const visit = await getOrCreateTodayVisit(patientId);
  await db.collection('labOrders').add({
    patientId, visitId: visit.id, date: todayStr(),
    tests, notes: document.getElementById('lo_notes').value.trim(),
    status: 'pending',
    orderedBy: CURRENT_USER.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  toast('Lab order created', 'success');
  closeModal(); renderView('lab');
}

async function saveLabResults(orderId) {
  const doc = await db.collection('labOrders').doc(orderId).get();
  const o = doc.data();
  const inputs = [...document.querySelectorAll('.result-input')];
  const tests = o.tests.map((t,i) => {
    const result = inputs[i].value.trim();
    // Look up the catalog test to get its range/normalText
    const cat = (CACHE.labTests || []).find(x => x.id === t.id);
    const flagInfo = cat ? flagLabResult(cat, result) : { flag: '', color: '' };
    return { ...t, result, flag: flagInfo.flag, unit: cat?.unit || t.unit || '', range: cat?.range || t.range || '', normalText: cat?.normalText || t.normalText || '' };
  });
  await db.collection('labOrders').doc(orderId).update({
    tests, labNotes: document.getElementById('lr_notes').value.trim(),
    status: 'ready',
    completedAt: firebase.firestore.FieldValue.serverTimestamp(),
    completedBy: CURRENT_USER.uid
  });
  toast('Results saved', 'success');
  closeModal(); renderView('lab');
}

  row.querySelector('.lc-edit-btn').classList.add('hidden');
  row.querySelector('.lc-del-btn').classList.add('hidden');
  row.querySelector('.lc-save-btn').classList.remove('hidden');
  row.querySelector('.lc-cancel-btn').classList.remove('hidden');
}

async function saveRadOrder() {

  let category = '';
  if (studyEl.tagName === 'SELECT') {
    const opt = studyEl.options[studyEl.selectedIndex];
    category = opt?.dataset?.cat || '';
  }
  const visit = await getOrCreateTodayVisit(patientId);
  await db.collection('radiologyOrders').add({
    patientId, visitId: visit.id, date: todayStr(),

    side: document.getElementById('ro_side').value,

let APPT_DATE = new Date().toISOString().slice(0,10);

async function viewAppointments(c) {

  const yesterday = new Date(selectedDate); yesterday.setDate(yesterday.getDate()-1);

  const yStr = yesterday.toISOString().slice(0,10);
  const tStr = tomorrow.toISOString().slice(0,10);

  const counts = {
    scheduled: appts.filter(a => a.status === 'scheduled').length,
    checkedin: appts.filter(a => a.status === 'checked-in').length,

        <div class="flex gap-3 text-sm">
          <span class="badge bg-blue-100 text-blue-700">Scheduled: ${counts.scheduled}</span>
          <span class="badge bg-yellow-100 text-yellow-700">Checked-in: ${counts.checkedin}</span>
          <span class="badge bg-green-100 text-green-700">Completed: ${counts.completed}</span>
          <span class="badge bg-gray-200 text-gray-700">Cancelled/No-show: ${counts.cancelled}</span>

      ${appts.length ? `<table><thead><tr>
        <th>Time</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th><th></th>
      </tr></thead><tbody>
        ${appts.map(a => {
          const p = CACHE.patients.find(x => x.id === a.patientId);
          const doc = CACHE.doctors.find(x => x.id === a.doctorId);
          const statusColor = a.status === 'completed' ? 'bg-green-100 text-green-700' :

                              a.status === 'cancelled' || a.status === 'no-show' ? 'bg-gray-200 text-gray-700' :
                              'bg-blue-100 text-blue-700';
          return `<tr>
            <td><b>${esc(a.time||'—')}</b></td>

            <td>${esc(doc ? (doc.name||doc.email) : '—')}</td>

async function viewQueue(c) {
  await refreshPatients();
  const today = todayStr();
  const snap = await db.collection('queue').where('date','==',today).get();
  const tokens = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (a.tokenNumber||0) - (b.tokenNumber||0));

  const waiting = tokens.filter(t => t.status === 'waiting');
  const inProgress = tokens.filter(t => t.status === 'in-consultation');
  const done = tokens.filter(t => t.status === 'done');
  const skipped = tokens.filter(t => t.status === 'no-show');

  const renderRow = (t, showActions) => {
    const p = CACHE.patients.find(x => x.id === t.patientId);
    const minutes = t.createdAt?.toDate ? Math.floor((Date.now() - t.createdAt.toDate().getTime()) / 60000) : '';
    const statusColor = t.status === 'waiting' ? 'bg-yellow-100 text-yellow-700' :
                        t.status === 'in-consultation' ? 'bg-blue-100 text-blue-700' :
                        t.status === 'done' ? 'bg-green-100 text-green-700' :
                        'bg-gray-200 text-gray-700';
    return `<tr>
      <td><b class="text-lg">T${String(t.tokenNumber||0).padStart(3,'0')}</b></td>
      <td>${esc(p ? patientName(p) : t.patientName || '—')}<br>
          <span class="text-xs text-gray-500">${esc(p?.number||'')} · ${esc(p?.phone||'')}</span></td>
      <td class="text-xs text-gray-500">${t.createdAt ? fmtDate(t.createdAt) : ''}${minutes!==''?`<br>${minutes} min ago`:''}</td>
      <td><span class="badge ${statusColor}">${esc(t.status)}</span></td>
      <td class="whitespace-nowrap">
        ${showActions && t.status === 'waiting' ? `
          <button onclick="queueStart('${t.id}')" class="text-blue-600 text-sm">Start</button>
          <button onclick="queueNoShow('${t.id}')" class="text-gray-500 text-sm ml-2">No-show</button>
        ` : ''}
        ${showActions && t.status === 'in-consultation' ? `
          <button onclick="queueDone('${t.id}')" class="text-green-600 text-sm">Done</button>
        ` : ''}
        <button onclick="queuePrint('${t.id}')" class="text-gray-500 text-sm ml-2">Print</button>
      </td>
    </tr>`;
  };

  c.innerHTML = `
    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
      <h2 class="text-2xl font-bold">Queue — ${fmtDate(new Date())}</h2>
      <div class="flex gap-2">
        <button onclick="newQueueToken()" class="btn btn-primary">+ New Token</button>
        <button onclick="printQueueBoard()" class="btn btn-secondary">🖨 Print Queue</button>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <div class="card p-3 text-yellow-700 bg-yellow-50"><div class="text-xs">Waiting</div><div class="text-2xl font-bold">${waiting.length}</div></div>
      <div class="card p-3 text-blue-700 bg-blue-50"><div class="text-xs">In Consultation</div><div class="text-2xl font-bold">${inProgress.length}</div></div>
      <div class="card p-3 text-green-700 bg-green-50"><div class="text-xs">Done</div><div class="text-2xl font-bold">${done.length}</div></div>
      <div class="card p-3 text-gray-700 bg-gray-100"><div class="text-xs">No-show</div><div class="text-2xl font-bold">${skipped.length}</div></div>
    </div>

    <div class="card p-4 mb-4">
      <h3 class="font-semibold mb-2 text-yellow-700">Waiting (${waiting.length})</h3>
      ${waiting.length ? `<table><thead><tr><th>Token</th><th>Patient</th><th>Waiting since</th><th>Status</th><th></th></tr></thead><tbody>
        ${waiting.map(t => renderRow(t, true)).join('')}
      </tbody></table>` : '<p class="text-gray-400">No one waiting.</p>'}
    </div>

    <div class="card p-4 mb-4">
      <h3 class="font-semibold mb-2 text-blue-700">In Consultation (${inProgress.length})</h3>
      ${inProgress.length ? `<table><thead><tr><th>Token</th><th>Patient</th><th>Started</th><th>Status</th><th></th></tr></thead><tbody>
        ${inProgress.map(t => renderRow(t, true)).join('')}
      </tbody></table>` : '<p class="text-gray-400">None.</p>'}
    </div>

    <div class="card p-4 mb-4">
      <h3 class="font-semibold mb-2 text-green-700">Done Today (${done.length})</h3>
      ${done.length ? `<div class="max-h-64 overflow-y-auto"><table><thead><tr><th>Token</th><th>Patient</th><th>Seen</th><th>Status</th><th></th></tr></thead><tbody>
        ${done.map(t => renderRow(t, false)).join('')}
      </tbody></table></div>` : '<p class="text-gray-400">None yet.</p>'}
    </div>

    ${skipped.length ? `<div class="card p-4">
      <h3 class="font-semibold mb-2 text-gray-500">No-show (${skipped.length})</h3>
      <table><thead><tr><th>Token</th><th>Patient</th><th>—</th><th>Status</th><th></th></tr></thead><tbody>
        ${skipped.map(t => renderRow(t, false)).join('')}
      </tbody></table>
    </div>` : ''}
  `;
}

async function nextQueueNumber() {
  const today = todayStr();
  const ref = db.collection('counters').doc('queue_' + today);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    const n = snap.exists ? (snap.data().last || 0) + 1 : 1;
    tx.set(ref, { last: n });
    return n;
  });
}

function checkInteractions(drugNames) {
  // drugNames: array of strings like ['Warfarin 5mg', 'Aspirin 75mg']
  if (!CACHE.drugInteractions || !drugNames.length) return [];

  // Normalize: lowercase, strip strength/dosage, extract first word
  const normalize = (n) => n.toLowerCase().trim().split(/[ ,()]+/)[0];
  const names = drugNames.map(normalize);

  const found = [];
  for (let i = 0; i < names.length; i++) {
    for (let j = i + 1; j < names.length; j++) {
      const a = names[i];
      const b = names[j];
      for (const it of CACHE.drugInteractions) {
        const ia = it.a, ib = it.b;
        if ((ia === a && ib === b) || (ia === b && ib === a)) {
          found.push({
            drugA: drugNames[i],
            drugB: drugNames[j],
            severity: it.severity,
            effect: it.effect
          });
          break;
        }
      }
    }
  }
  return found;
}

function renderInteractionWarnings(warnings, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!warnings.length) { el.innerHTML = ''; return; }

  const styleFor = (sev) => {
    if (sev === 'severe') return { bg:'bg-red-50 border-red-300', text:'text-red-800', icon:'⛔', label:'SEVERE' };
    if (sev === 'moderate') return { bg:'bg-orange-50 border-orange-300', text:'text-orange-800', icon:'⚠️', label:'MODERATE' };
    return { bg:'bg-yellow-50 border-yellow-300', text:'text-yellow-800', icon:'ℹ️', label:'MILD' };
  };

  el.innerHTML = `
    <div class="border rounded p-3 mb-3 ${warnings.some(w=>w.severity==='severe') ? 'bg-red-50 border-red-300' : 'bg-orange-50 border-orange-300'}">

// DRUG BATCH / EXPIRY HELPERS
// ============================================================
function todayStr2() { return new Date().toISOString().slice(0,10); }

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = (target - today) / 86400000;
  return Math.floor(diff);
}

function getBatchStatus(batch) {
  if (!batch.expiry) return { status: 'unknown', label: 'No expiry', color: 'bg-gray-100 text-gray-700' };
  const days = daysUntil(batch.expiry);
  if (days < 0)  return { status: 'expired', label: `Expired ${-days}d ago`, color: 'bg-red-100 text-red-700', days };
  if (days <= 30) return { status: 'urgent', label: `${days}d left`, color: 'bg-orange-100 text-orange-800', days };
  if (days <= 90) return { status: 'soon', label: `${days}d left`, color: 'bg-yellow-100 text-yellow-800', days };
  return { status: 'ok', label: `${days}d left`, color: 'bg-green-100 text-green-700', days };
}

function computeStock(drug) {
  if (!drug.batches || !drug.batches.length) return drug.stock || 0;
  return drug.batches
    .filter(b => !b.expiry || new Date(b.expiry) >= new Date(todayStr2()))
    .reduce((s,b) => s + (b.qty || 0), 0);
}

function totalStockIncludingExpired(drug) {
  if (!drug.batches || !drug.batches.length) return drug.stock || 0;
  return drug.batches.reduce((s,b) => s + (b.qty || 0), 0);
}

  const supplier = document.getElementById('b_supplier').value.trim();

  if (qty <= 0) return toast('Quantity must be > 0', 'error');
  if (!expiry) return toast('Expiry date required', 'error');

  const doc = await db.collection('drugs').doc(drugId).get();
  const drug = doc.data();
  const batches = drug.batches || [];

  batches.push({
    batch, qty, expiry, supplier,
    addedAt: new Date().toISOString(),
    addedBy: CURRENT_USER.uid
  });

  await db.collection('drugs').doc(drugId).update({
    batches,
    stock: computeStock({ ...drug, batches })
  });

  await loadCache();
  toast('Batch added', 'success');
  manageDrugBatches(drugId);
}

async function removeBatch(drugId, index) {
  const doc = await db.collection('drugs').doc(drugId).get();
  const drug = doc.data();
  const batches = (drug.batches || []).slice();
  if (index < 0 || index >= batches.length) return;

  const b = batches[index];
  if (!confirm(`Remove batch ${b.batch} (${b.qty} units, expires ${b.expiry})?`)) return;

  batches.splice(index, 1);
  await db.collection('drugs').doc(drugId).update({
    batches,
    stock: computeStock({ ...drug, batches })
  });

  await loadCache();
  toast('Batch removed', 'success');
  manageDrugBatches(drugId);
}

function getExpiryAlerts(drugs) {
  const expired = [];
  const urgent = [];   // <= 30 days
  const soon = [];     // 31-90 days
  drugs.forEach(d => {
    (d.batches || []).forEach(b => {
      const s = getBatchStatus(b);
      const entry = { drug: d, batch: b, status: s };
      if (s.status === 'expired') expired.push(entry);
      else if (s.status === 'urgent') urgent.push(entry);
      else if (s.status === 'soon') soon.push(entry);
    });
  });
  return { expired, urgent, soon };
}

  const rows = [...document.querySelectorAll('#pp_items > div')];

    const sig = r.querySelector('.rx-sig').value.trim();

      if (!opt || !opt.value) return null;

      (hasSevere ? '⛔ SEVERE drug interaction detected!\n\n' : '⚠️ Drug interaction(s) detected:\n\n')
      + summary
      + '\n\nContinue and save anyway?'
    );
    if (!ok) return;
  }

  const visit = await getOrCreateTodayVisit(patientId);
  await db.collection('prescriptions').add({
    patientId, visitId: visit.id, date: todayStr(),
    items, notes: document.getElementById('pp_notes').value.trim(),
    status: 'pending',
    interactions: warnings,
    hasSevereInteraction: warnings.some(w => w.severity === 'severe'),
    prescriberId: CURRENT_USER.uid,
    prescriberName: CURRENT_USER.name || CURRENT_USER.email,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  toast('Prescription saved', 'success');
  closeModal(); renderView('pharmacy');

async function confirmDispense(rxId) {
  const doc = await db.collection('prescriptions').doc(rxId).get();
  const r = doc.data();
  const batch = db.batch();

  for (const item of r.items || []) {
    if (!item.drugId) continue;
    const dref = db.collection('drugs').doc(item.drugId);
    const ds = await dref.get();
    if (!ds.exists) continue;
    const drug = ds.data();

    let remaining = item.qty;

    // If drug has batches → FIFO deduct from non-expired, oldest-expiry first
    if (drug.batches && drug.batches.length) {
      const batches = drug.batches.map(b => ({ ...b }));
      // Sort: non-expired first by expiry ascending
      batches.sort((a, b) => {
        const da = a.expiry ? new Date(a.expiry) : new Date('9999-12-31');
        const db_ = b.expiry ? new Date(b.expiry) : new Date('9999-12-31');
        return da - db_;
      });

      for (const b of batches) {
        if (remaining <= 0) break;
        // Skip expired
        if (b.expiry && new Date(b.expiry) < new Date(todayStr2())) continue;
        const take = Math.min(b.qty || 0, remaining);
        b.qty = (b.qty || 0) - take;
        remaining -= take;
      }

      batch.update(dref, {
        batches,
        stock: computeStock({ ...drug, batches })
      });
    } else {
      // Fallback: no batches → old behavior
      const cur = drug.stock || 0;
      batch.update(dref, { stock: Math.max(0, cur - item.qty) });
    }
  }

  batch.update(db.collection('prescriptions').doc(rxId), {
    status: 'dispensed',
    dispensedAt: firebase.firestore.FieldValue.serverTimestamp(),
    dispensedBy: CURRENT_USER.uid
  });

  await batch.commit();
  toast('Dispensed', 'success');
  closeModal(); renderView('pharmacy');
}

  if (drug.batches && drug.batches.length) {
    data.stock = computeStock(drug);
  } else {
    data.stock = parseInt(row.querySelector('.dc-edit-stock').value) || 0;
  }

  await db.collection('drugs').doc(id).update(data);
  await loadCache();
  toast('Updated', 'success');

  // ✅ Update the displayed spans so the row reflects the new values
  row.querySelector('.dc-view-name').textContent = data.name;
  row.querySelector('.dc-view-form').textContent = data.form || '—';
  row.querySelector('.dc-view-strength').textContent = data.strength || '—';
  row.querySelector('.dc-view-price').textContent = data.price;
  row.querySelector('.dc-view-stock').textContent = data.stock;
  row.querySelector('.dc-view-reorder').textContent = data.reorder;

  // ✅ Exit edit mode (re-shows Edit/Delete, hides Save/Cancel)
  cancelDrugRow(id);
}

async function deletePayment(paymentId) {
  if (CURRENT_USER.role !== 'admin') return toast('Only admins can delete payments', 'error');

  const doc = await db.collection('payments').doc(paymentId).get();
  if (!doc.exists) return toast('Payment not found', 'error');
  const p = doc.data();

  try {
    await assertDayNotLocked(p.date);
  } catch (e) {
    return toast(e.message, 'error');
  }

  const amount = (p.amount||0).toLocaleString();
  const mode = p.mode || '';
  const pt = CACHE.patients.find(x => x.id === p.patientId);
  const name = pt ? patientName(pt) : (p.patientName || '—');

    if (!confirm(`Delete this payment?\n\nPatient: ${name}\nAmount: KES ${amount}\nMode: ${mode}\n\nThis cannot be undone.`)) return;

  // 🔗 If this payment is linked to an invoice, roll back its paid amount
  if (p.invoiceId) {
    try {
      const invRef = db.collection('invoices').doc(p.invoiceId);
      const invDoc = await invRef.get();
      if (invDoc.exists) {
        const inv = invDoc.data();
        const newPaid = Math.max(0, (inv.paid || 0) - (p.amount || 0));
        const newStatus = inv.status === 'cancelled'
          ? 'cancelled'
          : newPaid <= 0
            ? 'issued'
            : newPaid >= (inv.total || 0)
              ? 'paid'
              : 'partial';
        await invRef.update({
          paid: newPaid,
          status: newStatus,
          lastPaymentDeletedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    } catch (e) {
      console.error('Failed to roll back invoice:', e);
      toast('Payment deleted, but invoice rollback failed: ' + e.message, 'error');
      renderView('payments');
      return;
    }
  }

  await db.collection('payments').doc(paymentId).delete();
  toast('Payment deleted', 'success');
  renderView('payments');
}

function drawVitalsChart(containerId, vitals, field, color, label, unit) {
  const points = vitals
    .filter(v => v[field] && !isNaN(parseFloat(v[field])))
    .map(v => ({ value: parseFloat(v[field]), ts: v.createdAt?.toDate ? v.createdAt.toDate() : new Date(v.createdAt || 0) }))
    .sort((a,b) => a.ts - b.ts);
  const el = document.getElementById(containerId);
  if (!el) return;
  if (points.length < 2) {
    el.innerHTML = `<div class="text-xs text-gray-400 text-center py-4">Need at least 2 readings for a trend chart</div>`;
    return;
  }
  const w = 600, h = 140, pad = 30;
  const minV = Math.min(...points.map(p => p.value));
  const maxV = Math.max(...points.map(p => p.value));
  const range = maxV - minV || 1;
  const xStep = (w - pad*2) / (points.length - 1);
  const yScale = v => h - pad - ((v - minV) / range) * (h - pad*2);
  const pathD = points.map((p, i) => `${i===0?'M':'L'} ${pad + i*xStep} ${yScale(p.value)}`).join(' ');
  const dots = points.map((p, i) => `<circle cx="${pad + i*xStep}" cy="${yScale(p.value)}" r="3" fill="${color}"/>`).join('');
  el.innerHTML = `
    <div class="text-xs font-semibold mb-1">${label} (${points.length} readings)</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#ccc"/>
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#ccc"/>
      <text x="${pad-5}" y="${pad}" text-anchor="end" font-size="10" fill="#666">${maxV}</text>
      <text x="${pad-5}" y="${h-pad}" text-anchor="end" font-size="10" fill="#666">${minV}</text>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"/>
      ${dots}
    </svg>`;
}

async function renderBalances() {
  // Outstanding = patients whose total payments < total billed
  // We compute "billed" from each visit's payments' items.total? Simpler: outstanding = debts collection + manual
  // Here we surface a computed view: for each patient, sum paid; show top unpaid accounts (from bills if you track).
  // Since bills aren't tracked separately, show patients with payments in last 30 days sorted by amount paid ascending.

  const start = new Date(); start.setDate(start.getDate()-30);
  const startStr = start.toISOString().slice(0,10);
  const snap = await db.collection('payments').where('date','>=',startStr).get();
  const pays = snap.docs.map(x => x.data());

  const byPatient = {};
  pays.forEach(p => {
    byPatient[p.patientId] = byPatient[p.patientId] || { paid: 0, items: [] };
    byPatient[p.patientId].paid += (p.amount||0);
    (p.items||[]).forEach(i => byPatient[p.patientId].items.push(i));
  });

  const rows = Object.entries(byPatient).map(([pid, v]) => {
    const p = CACHE.patients.find(x => x.id === pid);
    return { pid, patient: p, paid: v.paid };
  }).sort((a,b) => a.paid - b.paid);

  document.getElementById('reportBody').innerHTML = `
    <div class="text-center mb-4">
      <img src="logo.png" alt="Logo" style="max-width:130px;margin:0 auto .3rem auto;display:block">

    </div>

    <div class="card p-4 mb-4 bg-blue-50 border border-blue-200">
      <p class="text-sm">
        <b>How this works:</b> This view lists patients who have had at least one payment in the last 30 days,
        sorted by total paid ascending. Lowest-paid patients are at the top — likely to have balances pending.
        For formal invoice tracking, consider adding a "Bills" module.
      </p>
    </div>

    ${rows.length ? `<div class="card p-4">
      <table><thead><tr>
        <th>Patient</th><th>Number</th><th>Phone</th><th>Total Paid (30d)</th><th></th>

          <td>${esc(r.patient?.phone||'')}</td>

async function shareDayEndWhatsApp() {
  const d = DAYEND_DATE;
  const snap = await db.collection('payments').where('date','==',d).get();
  const pays = snap.docs.map(x => x.data());
  const byMode = {};
  let total = 0;
  pays.forEach(p => {
    const m = p.mode || 'Unknown';
    byMode[m] = (byMode[m]||0) + (p.amount||0);
    total += (p.amount||0);
  });

  const lines = [];
  lines.push('*StraightUpMedical — Day-End Report*');
  lines.push('📅 ' + d);
  lines.push('');
  lines.push('*TOTALS*');
  Object.entries(byMode).sort((a,b)=>b[1]-a[1]).forEach(([m,a]) => {
    lines.push(`${m}: KES ${a.toLocaleString()}`);
  });
  lines.push('—————');
  lines.push(`*TOTAL: KES ${total.toLocaleString()}*`);
  lines.push('');
  lines.push(`Transactions: ${pays.length}`);
  lines.push('');
  lines.push('Signed: ________________');

  const text = lines.join('\n');
  const encoded = encodeURIComponent(text);
  const url = `https://wa.me/?text=${encoded}`;

  // Try native share (mobile) first, then WhatsApp web fallback
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Day-End Report', text });
      return;
    } catch (e) {
      // user cancelled or share failed → fall through to WhatsApp
    }
  }
  window.open(url, '_blank');
}

async function isDayLocked(dateStr) {

// Check if the date of a record is locked (throws if locked)
async function assertDayNotLocked(dateStr) {
  if (!dateStr) return true;
  const doc = await db.collection('dayLocks').doc(dateStr).get();
  if (doc.exists && doc.data().locked === true) {
    throw new Error(`Day ${dateStr} is locked. Ask an admin to unlock before deleting.`);

  return true;
}
async function lockDay(dateStr) {
  if (!confirm(`Lock payments for ${dateStr}?\n\nNo new payments can be recorded for this date until an admin unlocks it.`)) return;
  await db.collection('dayLocks').doc(dateStr).set({
    locked: true,
    lockedAt: firebase.firestore.FieldValue.serverTimestamp(),
    lockedBy: CURRENT_USER.uid,
    lockedByName: CURRENT_USER.name || CURRENT_USER.email
  });

async function unlockDay(dateStr) {
  if (CURRENT_USER.role !== 'admin') return toast('Only admins can unlock a day', 'error');
  const reason = prompt(`Unlock ${dateStr}?\n\nEnter reason for audit trail (required):`);
  if (!reason || !reason.trim()) return toast('Unlock cancelled — reason required', 'error');
  await db.collection('dayLocks').doc(dateStr).set({
    locked: false,
    unlockedAt: firebase.firestore.FieldValue.serverTimestamp(),
    unlockedBy: CURRENT_USER.uid,
    unlockedByName: CURRENT_USER.name || CURRENT_USER.email,
    unlockReason: reason.trim()
  });

  renderDayEnd();
}

async function nextInvoiceNumber() {
  const year = new Date().getFullYear();
  const ref = db.collection('counters').doc('invoices_' + year);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    const n = snap.exists ? (snap.data().last || 0) + 1 : 1;
    tx.set(ref, { last: n });
    return `INV-${year}-${String(n).padStart(4,'0')}`;
  });
}

async function saveInvoice(status) {
  const inp = document.getElementById('inv_patient');
  const patientId = inp.dataset.patientId;
  if (!patientId) return toast('Select a patient', 'error');

  const rows = [...document.querySelectorAll('#inv_items > div')];
  const items = rows.map(r => {
    const desc = r.querySelector('.inv-desc').value.trim();
    const qty = parseFloat(r.querySelector('.inv-qty').value) || 0;
    const price = parseFloat(r.querySelector('.inv-price').value) || 0;
    if (!desc || qty <= 0) return null;
    return { desc, qty, price, lineTotal: qty * price };
  }).filter(Boolean);
  if (!items.length) return toast('Add at least one line item', 'error');

  const total = items.reduce((s,i) => s + i.lineTotal, 0);
  const p = CACHE.patients.find(x => x.id === patientId);
  const number = status === 'issued' ? await nextInvoiceNumber() : '';

  await db.collection('invoices').add({
    number,
    patientId,
    patientName: p ? patientName(p) : inp.value.trim(),
    date: document.getElementById('inv_date').value,
    dueDate: document.getElementById('inv_due').value,
    notes: document.getElementById('inv_notes').value.trim(),
    items,
    total,
    paid: 0,
    status,
    createdBy: CURRENT_USER.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    issuedAt: status === 'issued' ? firebase.firestore.FieldValue.serverTimestamp() : null,
    issuedBy: status === 'issued' ? CURRENT_USER.uid : null

async function invoicePaymentConfirm(invoiceId) {
  const invDoc = await db.collection('invoices').doc(invoiceId).get();
  if (!invDoc.exists) return toast('Invoice not found', 'error');
  const inv = invDoc.data();
  // 🔒 Check day lock
  const today = todayStr();
  try {
    const lockDoc = await db.collection('dayLocks').doc(today).get();
    if (lockDoc.exists && lockDoc.data().locked === true) {
      return toast('Today is locked. Contact admin to unlock before recording new payments.', 'error');
    }
  } catch (e) { /* ignore */ }
  const amount = parseFloat(document.getElementById('ipay_amount').value) || 0;
  if (amount <= 0) return toast('Enter an amount', 'error');
  const mode = document.getElementById('ipay_mode').value;

  // record into payments collection (unified with the rest of the app)
  const p = CACHE.patients.find(x => x.id === inv.patientId);
  const receiptNo = 'R' + Date.now().toString().slice(-8);
  const visit = await getOrCreateTodayVisit(inv.patientId);

  await db.collection('payments').add({
    patientId: inv.patientId,
    visitId: visit.id,
    date: todayStr(),
    items: (inv.items||[]).map(i => ({ desc: i.desc, amount: i.lineTotal })),
    amount,
    mode,
    receipt: receiptNo,
    invoiceId,
    invoiceNumber: inv.number || '',
    mpesaCode: document.getElementById('ipay_mpesa')?.value.trim() || '',
    shaMember: document.getElementById('ipay_sha_member')?.value.trim() || '',
    shaRef: document.getElementById('ipay_sha_ref')?.value.trim() || '',
    notes: document.getElementById('ipay_notes').value.trim(),
    receivedBy: CURRENT_USER.uid,
    receivedByName: CURRENT_USER.name || CURRENT_USER.email,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  // update invoice paid amount + status
  const newPaid = (inv.paid||0) + amount;
  const newStatus = newPaid >= (inv.total||0) ? 'paid' : 'partial';
  await db.collection('invoices').doc(invoiceId).update({
    paid: newPaid,
    status: newStatus,
    lastPaymentAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  toast('Payment recorded', 'success');
  closeModal();
  renderView('invoices');
}

async function invoicePrint(id) {
  const doc = await db.collection('invoices').doc(id).get();
  if (!doc.exists) return toast('Not found', 'error');
  const inv = doc.data();
  const p = CACHE.patients.find(x => x.id === inv.patientId);
  const bal = Math.max(0, (inv.total||0) - (inv.paid||0));

  openModal(`
    <div class="flex justify-between mb-3">
      <h3 class="text-xl font-bold">Invoice</h3>
      <div><button onclick="printElement('#printArea')" class="btn btn-primary text-sm">🖨 Print</button>
      <button onclick="closeModal()" class="btn btn-secondary text-sm">Close</button></div>
    </div>

    <div id="printArea" style="font-family:system-ui;padding:2rem;max-width:800px;margin:auto">
      <div style="text-align:center;border-bottom:2px solid #333;padding-bottom:.5rem;margin-bottom:1rem">
        <img src="logo.png" alt="Logo" style="max-width:150px;max-height:60px;margin-bottom:.3rem">
        <h1 style="margin:0;font-size:20px">StraightUpMedical</h1>
      </div>

      <table style="width:100%;border:none;margin:1rem 0;font-size:14px">
        <tr>
          <td style="border:none;padding:4px"><b>Invoice #:</b> ${esc(inv.number||'DRAFT')}</td>
          <td style="border:none;padding:4px;text-align:right"><b>Date:</b> ${esc(inv.date||'')}</td>
        </tr>
        <tr>
          <td style="border:none;padding:4px"><b>Patient:</b> ${esc(p ? patientName(p) : inv.patientName||'—')}</td>
          <td style="border:none;padding:4px;text-align:right"><b>Due:</b> ${esc(inv.dueDate||'')}</td>
        </tr>
        ${p ? `<tr>
          <td style="border:none;padding:4px"><b>Patient No:</b> ${esc(p.number||'')}</td>
          <td style="border:none;padding:4px;text-align:right"><b>Phone:</b> ${esc(p.phone||'')}</td>
        </tr>` : ''}
      </table>

      <table style="width:100%;border-collapse:collapse;margin:1rem 0">
        <thead>
          <tr style="background:#f0f0f0">
            <th style="text-align:left;padding:6px;border-bottom:1px solid #ccc">Description</th>
            <th style="text-align:right;padding:6px;border-bottom:1px solid #ccc">Qty</th>
            <th style="text-align:right;padding:6px;border-bottom:1px solid #ccc">Unit</th>
            <th style="text-align:right;padding:6px;border-bottom:1px solid #ccc">Amount</th>
          </tr>
        </thead>
        <tbody>
          ${(inv.items||[]).map(i => `<tr>
            <td style="padding:6px;border-bottom:1px solid #eee">${esc(i.desc)}</td>
            <td style="text-align:right;padding:6px;border-bottom:1px solid #eee">${i.qty}</td>
            <td style="text-align:right;padding:6px;border-bottom:1px solid #eee">${(i.price||0).toLocaleString()}</td>
            <td style="text-align:right;padding:6px;border-bottom:1px solid #eee"><b>${(i.lineTotal||0).toLocaleString()}</b></td>
          </tr>`).join('')}
        </tbody>
      </table>

      <table style="width:100%;border:none;margin-top:1rem;font-size:14px">
        <tr><td style="border:none;text-align:right;padding:3px">Total:</td><td style="border:none;text-align:right;padding:3px;width:140px"><b>KES ${(inv.total||0).toLocaleString()}</b></td></tr>
        <tr><td style="border:none;text-align:right;padding:3px">Paid:</td><td style="border:none;text-align:right;padding:3px">KES ${(inv.paid||0).toLocaleString()}</td></tr>
        <tr><td style="border:none;text-align:right;padding:3px"><b>Balance Due:</b></td><td style="border:none;text-align:right;padding:3px"><b>KES ${bal.toLocaleString()}</b></td></tr>
      </table>

      ${inv.notes ? `<p style="margin-top:1.5rem;font-size:13px"><b>Notes:</b> ${esc(inv.notes)}</p>` : ''}

      <p style="margin-top:3rem;font-size:12px;color:#666;text-align:center">
        Thank you. Please retain this invoice for your records.
      </p>
    </div>
  `, 'max-w-3xl');
}

async function viewAdmin(c) {
  const [usersSnap, patSnap, visSnap, paySnap] = await Promise.all([
    db.collection('users').get(),
    db.collection('patients').get(),
    db.collection('visits').get(),
    db.collection('payments').get()
  ]);
  const users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const totalRevenue = paySnap.docs.reduce((s,d) => s + (d.data().amount||0), 0);

  c.innerHTML = `
    <h2 class="text-2xl font-bold mb-4">Admin</h2>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <div class="card p-3"><div class="text-xs text-gray-500">Total Patients</div>
        <div class="text-2xl font-bold">${patSnap.size}</div></div>
      <div class="card p-3"><div class="text-xs text-gray-500">Total Visits</div>
        <div class="text-2xl font-bold">${visSnap.size}</div></div>
      <div class="card p-3"><div class="text-xs text-gray-500">Total Revenue</div>
        <div class="text-2xl font-bold">KES ${totalRevenue.toLocaleString()}</div></div>
      <div class="card p-3"><div class="text-xs text-gray-500">Staff Accounts</div>
        <div class="text-2xl font-bold">${users.length}</div></div>
    </div>

    <div class="card p-4 mb-4">
      <h3 class="font-semibold mb-2">Staff & Roles</h3>
      <p class="text-xs text-gray-500 mb-3">To add staff: Firebase Console → Authentication → Users → Add user. Then assign a role here.</p>
      <table><thead><tr><th>Name / Email</th><th>Role</th><th>Change role</th></tr></thead><tbody>
        ${users.map(u => `<tr>
          <td>${esc(u.name||u.email||u.id)}<br><span class="text-xs text-gray-500">${esc(u.email||'')}</span></td>
          <td>${esc(u.role||'pending')}</td>
          <td>
            <select onchange="changeRole('${u.id}', this.value)" class="input" style="width:auto">
              ${['admin','doctor','nurse','lab','radiology','pharmacy','reception','cashier','pending']
                .map(r => `<option ${u.role===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('')}
      </tbody></table>
    </div>

    <div class="card p-4">
      <h3 class="font-semibold mb-2">Catalogs</h3>
      <div class="flex flex-wrap gap-2">
        <button onclick="manageDrugCatalog()" class="btn btn-secondary">💊 Drug Catalog</button>
        <button onclick="manageLabCatalog()" class="btn btn-secondary">🔬 Lab Tests</button>
        <button onclick="manageRadCatalog()" class="btn btn-secondary">🩻 Radiology Tests</button>
      </div>
    </div>`;
}

async function changeRole(uid, role) {
  await db.collection('users').doc(uid).update({ role });
  toast('Role updated', 'success');
}

// AUTO-LOGOUT AFTER INACTIVITY
// ============================================================
const IDLE_TIMEOUT_MS = 15 * 60 * 1000; // 15 minutes
let _idleTimer = null;
function _resetIdleTimer() {
  if (!CURRENT_USER) return;
  clearTimeout(_idleTimer);
  _idleTimer = setTimeout(() => {
    if (!CURRENT_USER) return;
    toast('Logged out after 15 minutes of inactivity', 'info');
    auth.signOut();
  }, IDLE_TIMEOUT_MS);
}
['mousemove','keydown','click','touchstart','scroll'].forEach(evt =>
  document.addEventListener(evt, _resetIdleTimer, true)
);
// reset when user logs in (hook into existing onAuthStateChanged indirectly)
setInterval(() => { if (CURRENT_USER) _resetIdleTimer(); }, 60000);
</script>
